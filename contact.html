<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Quicksand:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Cybersec-Contato</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header class="header">
        <div id="menu-navegacao">
            <nav>
                <a href="index.html" id="titulo-header">Cybersecurity</a>
                <a href="index.html">Home</a>
                <a href="about.html">Sobre</a>
                <a href="contact.html">Contato</a>
                <a href="content.html">Conteúdos</a>
                <a href="security.html">Segurança</a>
            </nav>
        </div>
        <div class="controles-acessibilidade">
            <button id="btn-aumentar">A+</button>
            <button id="btn-diminuir">A-</button>
        </div>
        <button id="botao-tema">☼</button>
    </header>

        <section class="caixas secao-contato">
      <h2 class="subtitulo" style="text-align: center">Entre em Contato</h2>
      <p style="text-align: center; margin-bottom: 20px">
        Preencha os dados abaixo para enviar uma mensagem.
      </p>

      <form id="formulario-contato" class="form-estilizado">
        <div class="grupo-input">
          <label for="nome">Seu nome:</label>
          <input type="text" id="nome" placeholder="Escreva aqui..." />
          <span class="mensagem-erro" id="erro-nome"></span>
        </div>

        <div class="grupo-input">
          <label for="email">Seu e-mail:</label>
          <input type="email" id="email" placeholder="Escreva aqui..." />
          <span class="mensagem-erro" id="erro-email"></span>
        </div>

        <div class="grupo-input">
          <label for="mensagem">Sua mensagem:</label>
          <textarea
            id="mensagem"
            rows="5"
            placeholder="Escreva aqui..."
          ></textarea>
          <span class="mensagem-erro" id="erro-mensagem"></span>
        </div>

        <button type="submit" id="botao-enviar">Enviar</button>
      </form>
    </section>
    <script src="script.js"></script>
</body>

</html>
